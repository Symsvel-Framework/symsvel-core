name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, linux, ARM64, symsvel]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled PHP 8.4 and Composer
        run: |
          php -v
          composer --version
          php -r 'if (PHP_VERSION_ID < 80400 || PHP_VERSION_ID >= 80500) { exit(1); }'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --no-check-publish
      - run: php vendor/bin/phpunit
      - name: Publish GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace(/^refs\/tags\//, '');
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected semantic version tag.');
            const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            if (ref.data.ref !== `refs/tags/${tag}`) throw new Error('Tag verification failed.');
            await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: tag, generate_release_notes: true
            });
