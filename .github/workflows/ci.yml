name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: [self-hosted, linux, ARM64, symsvel]
    steps:
      - uses: actions/checkout@v4
      - name: Verify preinstalled PHP and Composer
        run: |
          php -v
          composer --version
          php -r 'if (PHP_VERSION_ID < 80400 || PHP_VERSION_ID >= 80500) { fwrite(STDERR, "PHP 8.4 required\n"); exit(1); }'
      - name: Validate Composer manifest
        run: composer validate --no-check-publish --no-check-lock
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint PHP files
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit
        run: vendor/bin/phpunit
